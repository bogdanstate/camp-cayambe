<form id="eoi">
  <label>{{ i18n "formName" }} <input name="name" required></label>
  <label>{{ i18n "formEmail" }} <input name="email" type="email" required></label>
  <label>{{ i18n "formPhone" }} <input name="phone" type="tel"></label>
  <label>{{ i18n "formCountry" }} <input name="country"></label>
  <label>{{ i18n "formExperience" }} <textarea name="experience" rows="3"></textarea></label>
  <label>{{ i18n "formComments" }} <textarea name="comments" rows="3"></textarea></label>
  <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button type="submit">{{ i18n "formSubmit" }}</button>
  <p id="status" role="status"></p>
</form>
<script>
document.getElementById("eoi").addEventListener("submit", async function (e) {
  e.preventDefault();
  const btn = this.querySelector("button");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.textContent = "";
  status.className = "";
  try {
    const resp = await fetch({{ site.Params.eoiEndpoint }}, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.fromEntries(new FormData(this))),
    });
    const result = await resp.json();
    if (resp.ok) {
      this.reset();
      status.textContent = {{ i18n "formReceived" }};
    } else {
      status.textContent = {{ i18n "formError" }};
      status.className = "error";
    }
  } catch (err) {
    status.textContent = {{ i18n "formNetworkError" }};
    status.className = "error";
  }
  btn.disabled = false;
});
</script>
