# per: person = amount per person; group = fixed amount split across the group;
# vehicle = amount per vehicle of `capacity` people (as many vehicles as needed).
# Text fields are either a plain string (same in every language) or {en, es, ro}.
group_sizes: [8, 16]
items:
- item: {en: Punanti accommodation, es: Alojamiento en Punanti, ro: Cazare la Punanti}
  basis: {en: 10 nights × $40, es: 10 noches × $40, ro: 10 nopți × $40}
  per: person
  amount: 400
- item: {en: Lunches, es: Almuerzos, ro: Prânzuri}
  basis: 10 × $5
  per: person
  amount: 50
- item: {en: Airport transportation, es: Traslado desde el aeropuerto, ro: Transfer de la aeroport}
  basis: {en: $200 per vehicle of 8, es: $200 por vehículo de 8, ro: $200 pe vehicul de 8 persoane}
