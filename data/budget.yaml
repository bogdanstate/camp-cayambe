# per: person = amount per person; group = fixed amount split across the group;
# vehicle = amount per vehicle of `capacity` people (as many vehicles as needed).
group_sizes: [8, 16]

items:
  - {item: "Punanti accommodation", basis: "10 nights × $40", per: person, amount: 400}
  - {item: "Lunches", basis: "10 × $5", per: person, amount: 50}
  - {item: "Airport transportation", basis: "$200 per vehicle of 8", per: vehicle, amount: 200, capacity: 8}
  - {item: "Cusin / Imbabura", basis: "$100 for the group", per: group, amount: 100}
  - {item: "Otavalo – Quito", basis: "$150 per vehicle of 4", per: vehicle, amount: 150, capacity: 4}
  - {item: "Local transportation", basis: "$50 per person", per: person, amount: 50}
  - {item: "Guide for Cayambe", basis: "$350 per climber, including the refuge night", per: person, amount: 350}
  - {item: "Guiding at Punanti", basis: "$100 per person", per: person, amount: 100}
  - {item: "Climbing sessions", basis: "3 sessions, $60 per person", per: person, amount: 60}
  - {item: "Quito hotel (Cumbayá)", basis: "2 nights × $100 per room, twin share", per: person, amount: 100}
  - {item: "Airport shuttle", basis: "2 taxi rides × $20 per car of 4", per: vehicle, amount: 40, capacity: 4}

not_included:
  - "Flights to and from Quito"
  - "Camping night, including gear and food"
  - "Hot springs entry"
  - "Meals in Quito, at camp and at the refuge"
  - "BBQs"
  - "Snacks and beverages at the lodge"
  - "Mountaineering equipment rental"
